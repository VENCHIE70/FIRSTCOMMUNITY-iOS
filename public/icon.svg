<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
  </defs>
  <!-- Background with subtle squircle -->
  <rect width="512" height="512" rx="104" fill="url(#bgGrad)"/>
  
  <!-- Subtle circular halo -->
  <circle cx="256" cy="220" r="140" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  <circle cx="256" cy="220" r="110" fill="none" stroke="rgba(234,179,8,0.2)" stroke-width="2" stroke-dasharray="6,6"/>

  <!-- Open Book / Bible silhouette -->
  <path d="M 170 230 C 210 215 240 225 256 235 C 272 225 302 215 342 230 L 342 300 C 302 285 272 295 256 305 C 240 295 210 285 170 300 Z" 
        fill="url(#goldGrad)" opacity="0.95" />
  
  <!-- Central Cross -->
  <rect x="249" y="140" width="14" height="110" rx="4" fill="#ffffff" />
  <rect x="226" y="170" width="60" height="14" rx="4" fill="#ffffff" />

  <!-- Badge banner for "1^ COMUNITÀ" -->
  <rect x="116" y="340" width="280" height="50" rx="14" fill="#ffffff" opacity="0.12" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" />
  <text x="256" y="372" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="21" fill="#f8fafc" letter-spacing="2">1^ COMUNITÀ S.AP.</text>
  
  <!-- Subtext RUBRICA & CALENDARIO -->
  <text x="256" y="420" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="15" fill="#94a3b8" letter-spacing="3">RUBRICA &amp; CALENDARIO</text>
</svg>
